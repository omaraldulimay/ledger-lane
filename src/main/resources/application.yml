server:
  port: ${PORT:8080}

spring:
  application:
    name: ledger-lane
  datasource:
    url: ${LEDGER_DB_URL:jdbc:postgresql://localhost:55433/ledger}
    username: ${LEDGER_DB_USER:ledger}
    password: ${LEDGER_DB_PASSWORD:ledger}
  jackson:
    deserialization:
      accept-float-as-int: false
  kafka:
    bootstrap-servers: ${LEDGER_KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

ledger:
  outbox:
    publisher: ${LEDGER_OUTBOX_PUBLISHER:log}   # log or kafka
